services:
  node:
    image: node:24-bookworm-slim
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/.npm
      VITE_APP_NAME: SponsorIn
    command: sh -c "[ -d node_modules ] || npm ci; npm run build"
